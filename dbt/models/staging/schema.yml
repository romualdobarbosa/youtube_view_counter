version: 2

models:
  - name: stg_channels
    description: Um registro por canal (versão vigente do SCD2).
    columns:
      - name: channel_id
        tests:
          - unique
          - not_null

  - name: stg_videos
    description: Um registro por vídeo (versão vigente do SCD2).
    columns:
      - name: video_id
        tests:
          - unique
          - not_null
      - name: video_type
        tests:
          - accepted_values:
              arguments:
                values: ['short', 'long']

  - name: stg_channel_metrics
    description: Snapshot de métricas de canal (uma linha por coleta).
    columns:
      - name: channel_key
        tests:
          - not_null
          # Aponta pra source (todas as versões), não pra stg_channels (só a
          # vigente): um fato antigo referencia legitimamente uma versão do
          # canal que já deixou de ser is_current — isso é o SCD2 funcionando
          # certo, não um dado quebrado. Testado contra Turso real: um teste
          # apontando pra stg_channels/stg_videos falha assim que qualquer
          # atributo versionado muda entre coletas.
          - relationships:
              arguments:
                to: source('raw', 'dim_channel')
                field: channel_key

  - name: stg_video_metrics
    description: Snapshot de métricas de vídeo (uma linha por coleta).
    columns:
      - name: video_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'dim_video')
                field: video_key
